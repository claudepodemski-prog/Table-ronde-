<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table ronde IA</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Table ronde">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout : barre de prompt en haut, quatre colonnes de réponses côte à côte (2×2 sur tablette, 1 sur téléphone) */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --fg:#171a21; --muted:#5b6270; --line:#dadde5;
  --accent:#2f45c9; --accent-fg:#ffffff; --danger:#b42318; --ok:#1c7c4a;
  --c-openai:#0f8f6f; --c-anthropic:#c4613f; --c-gemini:#3b74e0; --c-mistral:#e8590c;
  --f-ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111318; --surface:#1a1d24; --sunk:#14171d; --fg:#e8eaf0; --muted:#9aa1ae; --line:#2b303a;
  --accent:#7d8ff5; --accent-fg:#0d1020; --danger:#f2867c; --ok:#5fc98e;
  --c-openai:#3cc9a1; --c-anthropic:#e58a68; --c-gemini:#7aa5f5; --c-mistral:#ff8a4c; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1a1d24; --sunk:#14171d; --fg:#e8eaf0; --muted:#9aa1ae; --line:#2b303a;
  --accent:#7d8ff5; --accent-fg:#0d1020; --danger:#f2867c; --ok:#5fc98e;
  --c-openai:#3cc9a1; --c-anthropic:#e58a68; --c-gemini:#7aa5f5; --c-mistral:#ff8a4c; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;gap:12px;padding-block:18px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand span{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;padding:4px 8px;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--sunk)}

.composer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.composer textarea{width:100%;min-height:84px;max-height:40vh;resize:vertical;border:0;background:transparent;outline:none;font-size:16px;line-height:1.5}
.composer-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;cursor:pointer;user-select:none;background:var(--bg)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--pc);opacity:.35}
.chip:has(input:checked){border-color:var(--pc);background:var(--surface)}
.chip:has(input:checked) .dot{opacity:1}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:12px;font-family:var(--f-mono)}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:320px;border-top:3px solid var(--pc)}
.col.off{opacity:.55}
.col-head{display:flex;flex-direction:column;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.col-title{display:flex;align-items:center;gap:8px}
.col-title strong{font-size:15px}
.col-title small{color:var(--muted);font-size:12px}
.status{margin-left:auto;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.status.run{color:var(--accent)}
.status.done{color:var(--ok)}
.status.err{color:var(--danger)}
.model-row{display:flex;gap:6px;align-items:center}
.model-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;font:13px var(--f-mono)}
.col-body{padding:12px 14px;overflow:auto;flex:1;min-height:0;max-height:70vh;overflow-wrap:anywhere}
.col-body.empty{color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.col-body.error{color:var(--danger);white-space:pre-wrap;font-size:14px}
.col-foot{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 14px;border-top:1px solid var(--line);font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.col-foot .sp{margin-left:auto}

.md{font-size:14.5px}
.md>*:first-child{margin-top:0}
.md p,.md ul,.md ol{margin:0 0 .7em}
.md h1,.md h2,.md h3,.md h4{font-size:1.05em;margin:1em 0 .4em;line-height:1.3}
.md pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:12.5px/1.5 var(--f-mono)}
.md code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:.1em .3em;border-radius:4px}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13px}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md blockquote{margin:0 0 .7em;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent)}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,12,18,.45)}
.dlg-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:17px;margin:0;margin-right:auto}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.keyrow{display:flex;flex-direction:column;gap:6px}
.keyrow label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.keyrow label .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.keyrow label a{margin-left:auto;font-weight:400;font-size:13px;color:var(--accent)}
.keyrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font:13px var(--f-mono);width:100%}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.hist button:hover{border-color:var(--muted)}
.hist b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist small{color:var(--muted);font:12px var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:50}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>Table ronde IA</h1><span>un prompt, quatre réponses</span></div>
  <button class="btn" id="btnHistory" type="button">Historique</button>
  <button class="btn" id="btnSettings" type="button">Clés API</button>
</header>

<form class="composer" id="composer">
  <textarea id="prompt" placeholder="Posez votre question une seule fois, elle part vers toutes les IA cochées…" aria-label="Prompt"></textarea>
  <div class="composer-bar">
    <div class="toggles" id="toggles"></div>
    <span class="hint">Ctrl + Entrée</span>
    <button class="btn" id="btnStop" type="button" hidden>Arrêter</button>
    <button class="btn primary" id="btnSend" type="submit">Envoyer à tous</button>
  </div>
</form>

<main class="grid" id="grid"></main>

<dialog id="dlgSettings">
  <form method="dialog" id="settingsForm">
    <div class="dlg-head"><h2>Clés API</h2><button class="btn ghost" value="cancel" aria-label="Fermer">✕</button></div>
    <div class="dlg-body" id="keyRows">
      <p class="note">Les clés restent dans ce navigateur, sur cet ordinateur. Elles sont envoyées uniquement au fournisseur concerné. Chaque fournisseur facture l'API à l'usage, séparément de votre abonnement.</p>
    </div>
    <div class="dlg-foot"><button class="btn" value="cancel">Annuler</button><button class="btn primary" value="save" id="btnSaveKeys">Enregistrer</button></div>
  </form>
</dialog>

<dialog id="dlgHistory">
  <div class="dlg-head"><h2>Historique</h2><button class="btn ghost" type="button" id="btnClearHist">Tout effacer</button><button class="btn ghost" type="button" id="btnCloseHist" aria-label="Fermer">✕</button></div>
  <div class="dlg-body"><ul class="hist" id="histList"></ul></div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
// ---------- Stockage local (protégé) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem('trIA.'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('trIA.'+k, JSON.stringify(v)); }catch(e){} }
};

// ---------- Utilitaires réseau ----------
async function check(r){
  if (r.ok) return;
  let detail = '';
  try { const j = await r.json(); detail = j.error?.message || j.message || j.detail || JSON.stringify(j); } catch(e){}
  const hints = {
    400:'Requête refusée par le fournisseur.',
    401:'Clé API invalide ou expirée. Vérifiez-la dans « Clés API ».',
    402:'Crédit API épuisé. Rechargez votre compte API chez ce fournisseur.',
    403:'Accès refusé pour cette clé ou ce modèle.',
    404:'Modèle introuvable. Cliquez sur ↻ pour charger la liste des modèles disponibles.',
    429:'Limite atteinte ou crédit API épuisé. Attendez un peu ou rechargez votre compte API.',
    500:'Erreur côté fournisseur. Réessayez dans un instant.',
    529:'Service surchargé. Réessayez dans un instant.'
  };
  throw new Error((hints[r.status] || ('Erreur '+r.status)) + (detail ? '\n\nDétail : '+detail : ''));
}

async function readSSE(resp, onData){
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true){
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).replace(/\r$/, ''); buf = buf.slice(i+1);
      if (!line.startsWith('data:')) continue;
      const d = line.slice(5).trim();
      if (d === '[DONE]') return;
      let j; try { j = JSON.parse(d); } catch(e){ continue; }
      onData(j);
    }
  }
}

function openAIStyle(url){
  return {
    async stream(key, model, prompt, signal, onText){
      const r = await fetch(url+'/chat/completions', { method:'POST', signal,
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
        body: JSON.stringify({ model, stream:true, messages:[{ role:'user', content:prompt }] }) });
      await check(r);
      await readSSE(r, d => { if (d.error) throw new Error(d.error.message||'Erreur'); const t = d.choices?.[0]?.delta?.content; if (t) onText(t); });
    },
    async models(key){
      const r = await fetch(url+'/models', { headers:{ 'Authorization':'Bearer '+key } });
      await check(r); const j = await r.json();
      return j.data.map(m => m.id);
    }
  };
}

// ---------- Fournisseurs ----------
const PROVIDERS = [
  { id:'openai', name:'ChatGPT', vendor:'OpenAI', model:'gpt-5', keyUrl:'https://platform.openai.com/api-keys', ph:'sk-…',
    ...openAIStyle('https://api.openai.com/v1'),
    filter: ids => ids.filter(id => /^(gpt-|o\d|chatgpt)/.test(id) && !/(audio|realtime|transcribe|tts|image|search|embedding)/.test(id)).sort().reverse() },
  { id:'anthropic', name:'Claude', vendor:'Anthropic', model:'claude-sonnet-5-5', keyUrl:'https://console.anthropic.com/settings/keys', ph:'sk-ant-…',
    async stream(key, model, prompt, signal, onText){
      const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', signal,
        headers:{ 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model, max_tokens:8192, stream:true, messages:[{ role:'user', content:prompt }] }) });
      await check(r);
      await readSSE(r, d => {
        if (d.type === 'error') throw new Error(d.error?.message || 'Erreur');
        if (d.type === 'content_block_delta' && d.delta?.type === 'text_delta') onText(d.delta.text);
      });
    },
    async models(key){
      const r = await fetch('https://api.anthropic.com/v1/models?limit=100', { headers:{ 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' } });
      await check(r); const j = await r.json(); return j.data.map(m => m.id);
    }, filter: ids => ids },
  { id:'gemini', name:'Gemini', vendor:'Google', model:'gemini-2.5-flash', keyUrl:'https://aistudio.google.com/apikey', ph:'AIza…',
    async stream(key, model, prompt, signal, onText){
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse', { method:'POST', signal,
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key':key },
        body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }] }) });
      await check(r);
      await readSSE(r, d => {
        if (d.error) throw new Error(d.error.message || 'Erreur');
        for (const p of (d.candidates?.[0]?.content?.parts || [])) if (p.text && !p.thought) onText(p.text);
      });
    },
    async models(key){
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers:{ 'x-goog-api-key':key } });
      await check(r); const j = await r.json();
      return (j.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent')).map(m => m.name.replace('models/',''));
    }, filter: ids => ids.filter(id => /^gemini/.test(id) && !/(embedding|tts|image|live)/.test(id)).sort().reverse() },
  { id:'mistral', name:'Le Chat', vendor:'Mistral', model:'mistral-large-latest', keyUrl:'https://console.mistral.ai/api-keys', ph:'…',
    ...openAIStyle('https://api.mistral.ai/v1'),
    filter: ids => [...new Set(ids)].filter(id => !/(embed|moderation|ocr|transcribe)/.test(id)).sort() }
];

// ---------- État ----------
let keys = store.get('keys', {});
let enabled = store.get('enabled', { openai:true, anthropic:true, gemini:true, mistral:true });
let models = store.get('models', {});
let history = store.get('history', []);
const runs = {};   // id -> { ctrl, text, t0 }

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function md(text){
  if (window.marked && window.DOMPurify){ try { return DOMPurify.sanitize(marked.parse(text)); } catch(e){} }
  return '<p style="white-space:pre-wrap">'+esc(text)+'</p>';
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('Copié'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copié'); }catch(_){} ta.remove(); }
}

// ---------- Construction de l'interface ----------
function build(){
  const toggles = $('#toggles'), grid = $('#grid'), rows = $('#keyRows');
  for (const p of PROVIDERS){
    const pc = `--pc:var(--c-${p.id})`;
    toggles.insertAdjacentHTML('beforeend',
      `<label class="chip" style="${pc}"><input type="checkbox" id="en-${p.id}" ${enabled[p.id]!==false?'checked':''}><span class="dot"></span>${p.name}</label>`);

    grid.insertAdjacentHTML('beforeend', `
      <section class="col" id="col-${p.id}" style="${pc}" aria-label="${p.name}">
        <div class="col-head">
          <div class="col-title"><strong>${p.name}</strong><small>${p.vendor}</small><span class="status" id="st-${p.id}">Prêt</span></div>
          <div class="model-row">
            <input id="model-${p.id}" list="dl-${p.id}" value="${esc(models[p.id] || p.model)}" aria-label="Modèle ${p.name}" spellcheck="false">
            <datalist id="dl-${p.id}"></datalist>
            <button class="btn ghost" type="button" data-models="${p.id}" title="Charger la liste des modèles">↻</button>
          </div>
        </div>
        <div class="col-body empty" id="out-${p.id}"></div>
        <div class="col-foot"><span id="meta-${p.id}">—</span><span class="sp"></span><button class="btn ghost" type="button" data-copy="${p.id}">Copier</button></div>
      </section>`);

    rows.insertAdjacentHTML('beforeend', `
      <div class="keyrow" style="${pc}">
        <label for="key-${p.id}"><span class="dot"></span>${p.name} <small style="color:var(--muted);font-weight:400">${p.vendor}</small><a href="${p.keyUrl}" target="_blank" rel="noopener">Obtenir une clé ↗</a></label>
        <input id="key-${p.id}" type="password" autocomplete="off" spellcheck="false" placeholder="${p.ph}">
      </div>`);

    $('#en-'+p.id).addEventListener('change', e => { enabled[p.id] = e.target.checked; store.set('enabled', enabled); refreshCols(); });
    $('#model-'+p.id).addEventListener('change', e => { models[p.id] = e.target.value.trim(); store.set('models', models); });
  }
  grid.addEventListener('click', e => {
    const c = e.target.closest('[data-copy]'); if (c){ const r = runs[c.dataset.copy]; if (r?.text) copy(r.text); }
    const m = e.target.closest('[data-models]'); if (m) loadModels(m.dataset.models, m);
  });
  refreshCols();
}

function refreshCols(){
  for (const p of PROVIDERS){
    const col = $('#col-'+p.id), out = $('#out-'+p.id), on = enabled[p.id] !== false;
    col.classList.toggle('off', !on);
    if (out.classList.contains('empty')){
      out.textContent = !keys[p.id] ? 'Ajoutez votre clé API dans « Clés API » pour activer '+p.name+'.'
                       : on ? 'La réponse de '+p.name+' apparaîtra ici.' : p.name+' est désactivé pour ce prompt.';
    }
  }
}

function setStatus(id, cls, label){ const s = $('#st-'+id); s.className = 'status '+cls; s.textContent = label; }

async function loadModels(id, btn){
  const p = PROVIDERS.find(x => x.id === id);
  if (!keys[id]){ toast('Ajoutez d\'abord la clé '+p.name); return; }
  btn.disabled = true;
  try {
    const list = p.filter(await p.models(keys[id]));
    $('#dl-'+id).innerHTML = list.map(m => `<option value="${esc(m)}">`).join('');
    const inp = $('#model-'+id); inp.value = ''; inp.focus();
    toast(list.length+' modèles disponibles pour '+p.name);
  } catch(e){ toast('Liste indisponible : '+String(e.message).split('\n')[0]); }
  btn.disabled = false;
}

// ---------- Envoi ----------
async function runOne(p, prompt){
  const out = $('#out-'+p.id), meta = $('#meta-'+p.id);
  const model = $('#model-'+p.id).value.trim() || p.model;
  const run = runs[p.id] = { ctrl:new AbortController(), text:'', t0:performance.now(), model, error:null };
  out.className = 'col-body md cursor'; out.innerHTML = '';
  setStatus(p.id, 'run', 'En cours'); meta.textContent = model;
  let frame = 0, first = 0;
  const paint = () => { frame = 0; out.innerHTML = md(run.text); };
  try {
    await p.stream(keys[p.id], model, prompt, run.ctrl.signal, t => {
      if (!first) first = performance.now() - run.t0;
      run.text += t; if (!frame) frame = requestAnimationFrame(paint);
    });
    paint();
    run.ms = performance.now() - run.t0;
    setStatus(p.id, 'done', 'Terminé');
    meta.textContent = `${model} · ${(run.ms/1000).toFixed(1)} s · ${run.text.split(/\s+/).filter(Boolean).length} mots`;
    if (!run.text) out.innerHTML = '<p style="color:var(--muted)">Réponse vide.</p>';
  } catch(e){
    run.ms = performance.now() - run.t0;
    if (e.name === 'AbortError'){ setStatus(p.id, '', 'Arrêté'); paint(); }
    else {
      run.error = e instanceof TypeError ? 'Connexion impossible avec '+p.vendor+'. Vérifiez votre connexion internet. Si le problème persiste, le navigateur bloque peut-être l\'appel direct à ce service.' : e.message;
      out.className = 'col-body error'; out.textContent = run.error; setStatus(p.id, 'err', 'Erreur');
    }
  } finally { out.classList.remove('cursor'); }
}

async function send(){
  const prompt = $('#prompt').value.trim();
  if (!prompt){ $('#prompt').focus(); return; }
  const targets = PROVIDERS.filter(p => enabled[p.id] !== false && keys[p.id]);
  if (!targets.length){ toast('Ajoutez au moins une clé API'); $('#dlgSettings').showModal(); fillKeys(); return; }
  $('#btnSend').disabled = true; $('#btnStop').hidden = false;
  await Promise.allSettled(targets.map(p => runOne(p, prompt)));
  $('#btnSend').disabled = false; $('#btnStop').hidden = true;
  const results = {}; for (const p of targets){ const r = runs[p.id]; results[p.id] = { model:r.model, text:r.text, ms:r.ms, error:r.error }; }
  history.unshift({ prompt, date:Date.now(), results }); history = history.slice(0, 30); store.set('history', history);
}

function restore(h){
  $('#prompt').value = h.prompt;
  for (const p of PROVIDERS){
    const out = $('#out-'+p.id), r = h.results[p.id], meta = $('#meta-'+p.id);
    if (!r){ out.className = 'col-body empty'; out.textContent = 'Pas de réponse pour ce prompt.'; setStatus(p.id,'','—'); meta.textContent='—'; runs[p.id]=null; continue; }
    runs[p.id] = { text:r.text };
    if (r.error){ out.className = 'col-body error'; out.textContent = r.error; setStatus(p.id,'err','Erreur'); }
    else { out.className = 'col-body md'; out.innerHTML = md(r.text); setStatus(p.id,'done','Archivé'); }
    meta.textContent = `${r.model} · ${((r.ms||0)/1000).toFixed(1)} s`;
  }
}

// ---------- Dialogues ----------
function fillKeys(){ for (const p of PROVIDERS) $('#key-'+p.id).value = keys[p.id] || ''; }
$('#btnSettings').onclick = () => { fillKeys(); $('#dlgSettings').showModal(); };
$('#dlgSettings').addEventListener('close', () => {
  if ($('#dlgSettings').returnValue !== 'save') return;
  for (const p of PROVIDERS){ const v = $('#key-'+p.id).value.trim(); if (v) keys[p.id] = v; else delete keys[p.id]; }
  store.set('keys', keys); refreshCols(); toast('Clés enregistrées');
});
$('#btnHistory').onclick = () => {
  const ul = $('#histList');
  ul.innerHTML = history.length ? '' : '<li class="note">Vos comparaisons apparaîtront ici.</li>';
  history.forEach((h, i) => {
    const d = new Date(h.date).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' });
    ul.insertAdjacentHTML('beforeend', `<li><button type="button" data-h="${i}"><b>${esc(h.prompt)}</b><small>${d} · ${Object.keys(h.results).length} réponses</small></button></li>`);
  });
  $('#dlgHistory').showModal();
};
$('#histList').onclick = e => { const b = e.target.closest('[data-h]'); if (b){ restore(history[+b.dataset.h]); $('#dlgHistory').close(); } };
$('#btnCloseHist').onclick = () => $('#dlgHistory').close();
let clearArmed = false;
$('#btnClearHist').onclick = e => {
  if (!clearArmed){ clearArmed = true; e.target.textContent = 'Confirmer ?'; setTimeout(() => { clearArmed = false; e.target.textContent = 'Tout effacer'; }, 3000); return; }
  history = []; store.set('history', history); $('#dlgHistory').close(); toast('Historique effacé');
};

$('#composer').addEventListener('submit', e => { e.preventDefault(); send(); });
$('#prompt').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); } });
$('#btnStop').onclick = () => { for (const id in runs) runs[id]?.ctrl?.abort(); };

build();
if (!Object.keys(keys).length) setTimeout(() => { fillKeys(); $('#dlgSettings').showModal(); }, 300);
</script>
